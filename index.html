<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6f8">
  <title>Daily Desk | 日付・時刻・ニュース</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17191d;
      --muted: #777e89;
      --line: #e7e9ed;
      --paper: #ffffff;
      --bg: #f5f6f8;
      --accent: #315efb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { width: min(100% - 40px, 920px); margin: 0 auto; padding: 34px 0 56px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .brand { font-size: 13px; font-weight: 750; letter-spacing: .16em; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: .08em; }
    .hero { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; margin-top: 28px; padding: 34px 38px 30px; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .date { margin-top: 13px; font-size: clamp(17px, 3vw, 22px); font-weight: 600; letter-spacing: .03em; }
    .time { margin-top: 8px; font-size: clamp(58px, 12vw, 112px); line-height: 1.08; font-weight: 300; letter-spacing: -.065em; font-variant-numeric: tabular-nums; }
    .timezone { margin-top: 10px; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    .section-head { display: flex; justify-content: space-between; align-items: end; margin: 34px 2px 14px; }
    h1 { margin: 0; font-size: 21px; letter-spacing: .02em; }
    .updated { color: var(--muted); font-size: 11px; }
    .news { overflow: hidden; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; }
    .news-item { display: block; padding: 19px 22px; color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); transition: background .18s ease; }
    .news-item:last-child { border-bottom: 0; }
    .news-item:hover { background: #fafbff; }
    .news-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
    .source { color: var(--accent); font-weight: 700; }
    .news-title { font-size: 14px; line-height: 1.7; font-weight: 600; }
    .news-empty { padding: 26px 22px; color: var(--muted); font-size: 13px; line-height: 1.8; }
    footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 18px; color: var(--muted); font-size: 10px; line-height: 1.7; }
    footer a { color: inherit; }
    @media (max-width: 600px) {
      .shell { width: min(100% - 28px, 920px); padding-top: 22px; }
      .hero { margin-top: 20px; padding: 26px 22px 24px; border-radius: 15px; }
      .section-head { margin-top: 28px; }
      .news-item { padding: 17px 17px; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">DAILY DESK</div>
      <div class="edition">JAPAN STANDARD TIME</div>
    </header>

    <section class="hero" aria-label="現在の日付と時刻">
      <div class="eyebrow">TODAY</div>
      <div class="date" id="date">日付を読み込み中</div>
      <div class="time" id="time">--:--:--</div>
      <div class="timezone">東京・日本標準時（JST）</div>
    </section>

    <section aria-labelledby="news-heading">
      <div class="section-head">
        <div>
          <div class="eyebrow">LATEST UPDATES</div>
          <h1 id="news-heading">最新ニュース</h1>
        </div>
        <div class="updated" id="updated">取得中…</div>
      </div>
      <div class="news" id="news-list" aria-live="polite">
        <div class="news-empty">最新ニュースを読み込んでいます。</div>
      </div>
    </section>

    <footer>
      <span>ニュース見出し：Google ニュース提供フィード</span>
      <span>時刻・日付は日本時間で表示</span>
    </footer>
  </main>

  <script>
    const dateFormatter = new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo", year: "numeric", month: "long", day: "numeric", weekday: "long"
    });
    const timeFormatter = new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
    });

    function updateClock() {
      const now = new Date();
      document.getElementById("date").textContent = dateFormatter.format(now);
      document.getElementById("time").textContent = timeFormatter.format(now);
    }
    updateClock();
    setInterval(updateClock, 1000);

    const feedUrl = "https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja";
    const apiUrl = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feedUrl);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    function renderNews(items) {
      const list = document.getElementById("news-list");
      const validItems = (items || []).filter(item => item.title && item.link).slice(0, 8);
      if (!validItems.length) throw new Error("ニュースがありません");
      list.innerHTML = validItems.map(item => {
        const date = item.pubDate ? new Date(item.pubDate) : null;
        const time = date && !Number.isNaN(date.getTime())
          ? new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }).format(date)
          : "";
        const source = item.author || "Google ニュース";
        return '<a class="news-item" href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="news-meta"><span class="source">' + escapeHtml(source) + '</span><span>' + escapeHtml(time) + '</span></div>' +
          '<div class="news-title">' + escapeHtml(item.title) + '</div></a>';
      }).join("");
      document.getElementById("updated").textContent =
        "更新 " + new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit" }).format(new Date());
    }

    async function loadNews() {
      try {
        const response = await fetch(apiUrl, { cache: "no-store" });
        if (!response.ok) throw new Error("ニュース取得に失敗しました");
        const data = await response.json();
        if (data.status !== "ok") throw new Error("ニュース取得に失敗しました");
        renderNews(data.items);
      } catch (error) {
        document.getElementById("news-list").innerHTML =
          '<div class="news-empty">ニュースを読み込めませんでした。通信状況を確認するか、<a href="https://news.google.com/?hl=ja&gl=JP&ceid=JP:ja" target="_blank" rel="noopener noreferrer">Google ニュース</a>をご覧ください。</div>';
        document.getElementById("updated").textContent = "取得できません";
      }
    }
    loadNews();
    setInterval(loadNews, 10 * 60 * 1000);
  </script>
</body>
</html>
